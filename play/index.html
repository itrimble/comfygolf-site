<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the HUD can sit under the notch; the
         maximum-scale/user-scalable pair stops a double tap on the game
         from zooming the page instead of reaching the control. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Comfy Golf" />
    <meta name="theme-color" content="#0a120c" />
    <title>Comfy Golf</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0a120c; }
      /* The page never scrolls: a drag on the game is a gesture, not a
         scroll, and iOS would otherwise rubber-band the page. */
      body { overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
             font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#eef3ea; }
      #app { position:fixed; inset:0; }
      #viewport { display:block; width:100%; height:100%; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }

      /* The loading screen is STATIC: it lives in the markup, not in the
         script, so it is on screen while the JS bundle itself is still
         downloading - the part a player on a phone waits through with no
         feedback at all. */
      #loading { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
                 background:radial-gradient(120% 90% at 50% 20%, #16281a 0%, #0a120c 70%);
                 padding:calc(env(safe-area-inset-top, 0px) + 20px) 24px calc(env(safe-area-inset-bottom, 0px) + 20px); }
      #loading.done { opacity:0; pointer-events:none; transition:opacity .32s ease; }
      .ld-wrap { width:min(420px, 100%); text-align:center; }
      .ld-icon { display:block; width:80px; height:80px; margin:0 auto 16px; border-radius:18px;
                 border:1px solid rgba(255,255,255,.14); box-shadow:0 12px 30px rgba(0,0,0,.45); }
      .ld-brand { font-size:clamp(26px, 8vw, 38px); font-weight:800; letter-spacing:5px; margin-bottom:6px; }
      .ld-hole { color:#9db894; font-size:13px; letter-spacing:2.4px; margin-bottom:26px; }
      .ld-bar { height:9px; border-radius:5px; background:rgba(255,255,255,.12); overflow:hidden; }
      .ld-bar i { display:block; height:100%; width:0%; border-radius:5px;
                  background:linear-gradient(90deg, #6aa84f, #a8d98a); transition:width .25s ease; }
      .ld-line { margin-top:12px; font-size:13.5px; }
      .ld-detail { margin-top:5px; font-size:11.5px; color:#93a889; min-height:15px;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .ld-foot { margin-top:26px; font-size:11px; color:#75886c; line-height:1.6; }
      .ld-err { margin-top:14px; font-size:12px; color:#ffb347; }
      @media (prefers-reduced-motion: reduce) { .ld-bar i { transition:none; } }
    </style>
    <script type="module" crossorigin src="./assets/index-VPKOZjaS.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="hud"></div>
    </div>

    <div id="loading">
      <div class="ld-wrap">
        <img class="ld-icon" src="./icons/icon-192.png" alt="Comfy Golf" width="80" height="80" />
        <div class="ld-brand">COMFY GOLF</div>
        <!-- Filled in by LoadingScreen.setHole once the script knows which
             hole the URL asked for. Until then it must not name one: it
             used to say "HOLE 1 · PAR 4" over ?course=dune-ridge&hole=2. -->
        <div class="ld-hole" id="ldHole">PARKLAND &amp; LINKS GOLF</div>
        <div class="ld-bar"><i id="ldFill"></i></div>
        <div class="ld-line" id="ldLine">Starting…</div>
        <div class="ld-detail" id="ldDetail"></div>
        <div class="ld-err" id="ldErr" hidden></div>
        <div class="ld-foot">The first visit downloads the whole course. After that it is
          cached on this device and opens straight away.</div>
      </div>
    </div>

  </body>
</html>
